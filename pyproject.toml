[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decision_bakeoff"
version = "0.1.0"
description = "Offline/shadow evaluation of decision architectures A0–A5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sklearn = ["scikit-learn"]

[tool.setuptools.packages.find]
include = ["decision_bakeoff*"]
